<!doctype html>
<html lang="en" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Sign in · memeclip</title>
<link rel="icon" href="/static/icon.svg?v=__VERSION__" type="image/svg+xml">
<link rel="stylesheet" href="/static/base.css?v=__VERSION__">
<link rel="stylesheet" href="/static/themes/__THEME__.css?v=__VERSION__">
<style>
  .signin { min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px; }
  .signin-card { width: min(420px, 100%); display: grid; gap: 20px; text-align: left; }
  .signin h1 { font-family: var(--display, inherit); font-size: clamp(36px, 8vw, 52px); line-height: 1; letter-spacing: -.03em; margin: 0; }
  .signin p { margin: 0; color: var(--text-2, inherit); line-height: 1.55; }
  .signin .fine { font-size: 13px; color: var(--text-3, inherit); }
  .signin .fine a { color: inherit; text-underline-offset: 3px; }
  /* Google's own button style: white, the G mark, "Sign in with Google" */
  .gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; height: 48px; padding: 0 20px;
          border-radius: 999px; background: #fff; color: #1f1f1f; border: 1px solid #747775; text-decoration: none;
          font: 500 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .01em; }
  .gbtn:hover { background: #f2f2f2; }
  .gbtn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .gbtn svg { width: 20px; height: 20px; flex: none; }
  .note { padding: 14px 16px; border-radius: 16px; border: 1px solid var(--hair, rgba(255,255,255,.14)); }
  .note[hidden], .gbtn[hidden] { display: none; }
</style>
</head>
<body>
<main class="signin">
  <div class="signin-card">
    <h1>memeclip</h1>
    <p id="lede">Search Hindi and English meme clips by the line, the person or the situation you're in. Sign in to start.</p>
    <p class="note" id="note" role="status" hidden></p>
    <a class="gbtn" id="google" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </a>
    <p class="fine">We only ask Google for your name, email address and profile picture. <a href="/privacy">Privacy policy</a> · <a href="/legal">Data and legal</a></p>
  </div>
</main>
<script>
  const MESSAGES = {
    waitlist: "You're on the waitlist. memeclip is open to a limited number of people for now; you'll get in as soon as a place opens.",
    blocked: "This account can't use memeclip. If you think that's a mistake, contact the site owner.",
    error: "Sign-in didn't finish. Please try again.",
  };
  const state = new URLSearchParams(location.search).get("state");
  if (MESSAGES[state]) {
    const note = document.getElementById("note");
    note.textContent = MESSAGES[state];
    note.hidden = false;
    if (state === "waitlist" || state === "blocked") document.getElementById("lede").hidden = true;
    if (state === "blocked") document.getElementById("google").hidden = true;
    if (state === "waitlist") document.getElementById("google").lastChild.textContent = " Use another Google account";
  }
</script>
</body>
</html>
