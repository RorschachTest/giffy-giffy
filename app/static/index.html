<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<title>memeclip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@300;400;500;600;700&family=Pixelify+Sans:wght@500&display=swap">
<style>
  /* Sticker wall (Gen Z pass, after the Dribbble "scroll-stopping banner" collage):
     clips are tilted posters with their mood as a chunky coloured sticker; every
     mood owns one saturated colour, used for its sticker and its quick search.
     Built on the high-end-visual-design trial below. */
  /* high-end-visual-design trial: "Ethereal Glass" texture + "Asymmetrical Bento" layout.
     OLED black with two soft glows (subtitle gold, deep emerald), glass only on
     fixed layers (nav, dialogs), every clip in a double bezel: an outer tray and
     an inner core with concentric radii. The yellow of burned-in subtitles stays
     the one accent: dialogue on a playing clip, what the search understood, focus. */
  :root {
    color-scheme: dark;
    --void: #050505;
    --tray: rgba(255, 255, 255, .035);      /* outer bezel */
    --core: #0d0d0f;                        /* inner core */
    --core-hi: #141417;
    --hair: rgba(255, 255, 255, .09);
    --hair-strong: rgba(255, 255, 255, .16);
    --glass: rgba(18, 18, 21, .62);
    --text: #f2f1ee;
    --text-2: #b9b9c0;
    --text-3: #8b8b95;                      /* 5.6:1 on --void */
    --subtitle: #ffd54a;
    --danger: #ff8a7a;
    --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Bricolage Grotesque", "Geist", ui-sans-serif, system-ui, sans-serif;
    --pixel: "Pixelify Sans", ui-monospace, Menlo, monospace;
    --cream: #f4ede4;                       /* the bright search pill */
    --spring: cubic-bezier(.32, .72, 0, 1);
    --r-shell: 28px; --pad-shell: 6px; --r-core: 22px; --pad-core: 8px; --r-media: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--void); }
  body { margin: 0; min-height: 100dvh; background: var(--void); color: var(--text); font: 400 15px/1.55 var(--font);
         -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  /* two soft glows and a whisper of grain, on fixed layers that never scroll */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(42rem 30rem at 12% -6%, rgba(255, 196, 64, .13), transparent 70%),
                radial-gradient(46rem 34rem at 96% 108%, rgba(24, 160, 128, .12), transparent 70%); }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: .035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  .stage { position: relative; z-index: 2; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .frame, .pill { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.25;
          stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--subtitle); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- floating island nav (glass is fine here: it is sticky) ---------- */
  .island-wrap { position: sticky; top: calc(14px + env(safe-area-inset-top)); z-index: 10; display: flex; justify-content: center;
                 padding: 14px 16px 0; pointer-events: none; }
  .island { pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 18px;
            border-radius: 999px; background: var(--glass); border: 1px solid var(--hair);
            backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); max-width: calc(100vw - 32px); }
  .wordmark { font-weight: 600; letter-spacing: -.03em; font-size: 16px; margin-right: 10px; }

  /* pills, and the button-in-button trailing knob */
  .cta { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 5px 5px 5px 18px;
         border-radius: 999px; border: 1px solid var(--hair-strong); background: rgba(255, 255, 255, .03);
         color: var(--text); text-decoration: none; white-space: nowrap; font-weight: 500;
         transition: background-color .5s var(--spring), border-color .5s var(--spring), transform .4s var(--spring); }
  .cta:hover { background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .24); }
  .cta:active { transform: scale(.98); }
  .cta .knob { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
               background: rgba(255, 255, 255, .08); transition: transform .5s var(--spring), background-color .5s var(--spring); }
  .cta:hover .knob { transform: translate(2px, -1px) scale(1.05); background: rgba(255, 255, 255, .14); }
  .cta.light { background: var(--cream); color: #0a0a0a; border-color: var(--cream); }
  .cta.light .knob { background: rgba(0, 0, 0, .08); }
  .cta.light:hover { background: #fff; }
  .cta.ghost { border-color: transparent; background: transparent; padding: 5px 14px; color: var(--text-2); }
  .cta.ghost:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
  .cta.ghost[aria-pressed="true"] { color: var(--subtitle); }
  .cta.round { padding: 5px; }
  .cta.done { border-color: var(--subtitle); color: var(--subtitle); }

  /* ---------- hero ---------- */
  main { max-width: 1240px; margin: 0 auto; padding: 0 24px 96px; }
  .hero { padding: 88px 0 40px; display: grid; gap: 22px; max-width: 760px; }
  .eyebrow { font-family: var(--pixel); letter-spacing: .08em !important; justify-self: start; border-radius: 999px; padding: 5px 12px; font-size: 10.5px; font-weight: 500;
             letter-spacing: .2em; text-transform: uppercase; color: var(--text-2); border: 1px solid var(--hair);
             background: var(--tray); }
  .hero h1 { margin: 0; font-family: var(--display); font-size: clamp(44px, 8vw, 92px); line-height: .9;
             letter-spacing: -.04em; font-weight: 800; text-wrap: balance; }
  .hero h1 .tag { display: inline-block; font-size: .32em; letter-spacing: -.01em; vertical-align: .9em; margin-left: .2em;
                  padding: .18em .55em; border-radius: 999px; background: #ff5fa2; color: #160810; transform: rotate(6deg);
                  font-weight: 700; }
  .hero p.lede { margin: 0; color: var(--text-2); font-size: 17px; max-width: 52ch; text-wrap: pretty; }
  /* the search sits in its own double bezel */
  .shell { border-radius: var(--r-shell); padding: var(--pad-shell); background: var(--tray); border: 1px solid var(--hair); }
  .core { border-radius: var(--r-core); background: var(--core); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .08); }
  .search { position: relative; }
  .search .core { display: flex; align-items: center; background: var(--cream); color: #121212; border-radius: 999px; }
  .search .shell { border-radius: 999px; }
  .search svg { position: absolute; left: 22px; color: var(--text-3); pointer-events: none; width: 20px; height: 20px; }
  #q { width: 100%; height: 64px; background: transparent; border: 0; border-radius: 999px; color: #121212; font-weight: 500;
       padding: 0 22px 0 56px; font-size: 19px; letter-spacing: -.01em; outline: none; }
  #q::placeholder { color: #6b6560; }
  .search svg { color: #6b6560 !important; }
  .search .shell { transition: border-color .5s var(--spring), background-color .5s var(--spring); }
  .search .shell:focus-within { border-color: #ff5fa2; background: rgba(255, 95, 162, .12); }

  .tabs { display: none; gap: 4px; padding: 4px; border-radius: 999px; background: var(--tray); border: 1px solid var(--hair);
          justify-self: start; }
  body.curate .tabs { display: inline-flex; }
  .tab { background: none; border: 0; border-radius: 999px; color: var(--text-2); padding: 0 16px; min-height: 38px;
         transition: background-color .4s var(--spring), color .4s var(--spring); }
  .tab[aria-pressed="true"] { color: #0a0a0a; background: var(--text); }
  .quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
  .quick::-webkit-scrollbar { display: none; }
  .pill { flex: none; min-height: 38px; padding: 0 16px; border-radius: 999px; background: var(--tray);
          border: 1px solid var(--hair); color: var(--text-2);
          transition: background-color .4s var(--spring), color .4s var(--spring), border-color .4s var(--spring); }
  .pill { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; }
  .pill::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 8px;
                  background: var(--mood, var(--text-3)); vertical-align: 1px; }
  .pill:hover { color: var(--text); border-color: var(--mood, var(--hair-strong)); }
  .pill[aria-pressed="true"] { color: #111; background: var(--mood, var(--text)); border-color: var(--mood, var(--text)); }
  .pill[aria-pressed="true"]::before { background: #111; }
  #status { min-height: 24px; margin: 0; color: var(--text-3); font-size: 14px; }
  #status .read { color: var(--subtitle); font-weight: 500; }

  /* ---------- asymmetric bento of double-bezel clips ---------- */
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: dense; margin-top: 8px; }
  .card.feature { grid-column: span 2; grid-row: span 2; }
  @media (max-width: 1023px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 767px) {   /* mobile collapse: one column, no spans */
    main { padding: 0 16px 64px; } .hero { padding: 48px 0 28px; }
    .grid { grid-template-columns: 1fr; gap: 16px; } .card.feature { grid-column: auto; grid-row: auto; }
  }
  .card { min-width: 0; transition: transform .7s var(--spring); }
  @media (min-width: 768px) {
    .card:nth-child(4n+1) { transform: rotate(-1.6deg); }
    .card:nth-child(4n+2) { transform: rotate(1.2deg) translateY(10px); }
    .card:nth-child(4n+3) { transform: rotate(-.8deg) translateY(-6px); }
    .card:nth-child(4n)   { transform: rotate(1.8deg); }
    .card.feature { transform: rotate(-1deg); }
    .card:hover, .card:focus-within { transform: rotate(0) translateY(-4px) scale(1.01); z-index: 3; position: relative; }
  }
  .card .core { background: #101012; }
  .stick { position: absolute; left: 12px; bottom: 12px; z-index: 2; pointer-events: none; max-width: calc(100% - 24px);
           font-family: var(--display); font-weight: 800; font-size: clamp(18px, 2.2vw, 26px); line-height: .95;
           letter-spacing: -.03em; text-transform: uppercase; color: #111; background: var(--mood, #f4ede4);
           padding: .32em .5em .28em; border-radius: 10px; transform: rotate(-4deg); transform-origin: left bottom;
           box-shadow: 0 0 0 2px #111, 3px 4px 0 0 #111; transition: transform .6s var(--spring), opacity .4s var(--spring); }
  .card.feature .stick { font-size: clamp(26px, 3.6vw, 46px); left: 18px; bottom: 18px; }
  .card:hover .stick { transform: rotate(-7deg) scale(1.04); }
  .frame.live .stick { opacity: 0; }               /* make room for the subtitle while it plays */
  .badge { position: absolute; top: 10px; left: 10px; z-index: 2; pointer-events: none; font-family: var(--pixel);
           font-size: 12px; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: #f4ede4; color: #111;
           transform: rotate(-2deg); }
  .card > .shell { height: 100%; }
  .card .core { padding: var(--pad-core); display: flex; flex-direction: column; gap: 12px; height: 100%; }
  .frame { position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: var(--r-media); overflow: hidden;
           cursor: pointer; isolation: isolate; }
  .card.feature .frame { aspect-ratio: auto; flex: 1; min-height: 300px; }
  .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block;
                 transition: transform .9s var(--spring); }
  .frame:hover video, .frame.live video { transform: scale(1.015); }
  .frame::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
  .sub { position: absolute; left: 14px; right: 14px; bottom: 18px; text-align: center; pointer-events: none; z-index: 1;
         color: var(--subtitle); font-weight: 600; font-size: 15px; line-height: 1.3; opacity: 0; transform: translateY(6px);
         transition: opacity .45s var(--spring), transform .45s var(--spring);
         text-shadow: 0 0 3px #000, 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.feature .sub { font-size: 19px; bottom: 26px; }
  .frame.live .sub { opacity: 1; transform: none; }
  .snd { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 999px; z-index: 1;
         display: grid; place-items: center; background: rgba(0, 0, 0, .55); color: var(--text);
         opacity: 0; transition: opacity .4s var(--spring); pointer-events: none; }
  .frame.live .snd { opacity: 1; }
  .bar-time { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--subtitle); z-index: 1;
              transform-origin: left; transform: scaleX(0); opacity: 0; }
  .frame.live .bar-time { opacity: 1; }
  .row { display: flex; align-items: center; gap: 10px; padding: 2px 4px 4px 8px; }
  .titles { flex: 1; min-width: 0; }
  .name { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.3; letter-spacing: -.01em; overflow: hidden; overflow-wrap: anywhere;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-wrap: pretty; }
  .card.feature .name { font-size: 24px; letter-spacing: -.03em; }
  .by { color: var(--text-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 6px; flex: none; }
  /* small posters in the collage: the copy button is just its round knob, so names keep their room */
  @media (min-width: 768px), (max-width: 380px) {
    .card:not(.feature) .acts .cta .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .card:not(.feature) .acts .cta { padding: 5px; } }

  /* curation only */
  .curate-only { display: none; }
  body.curate .curate-only { display: flex; }
  .chips { flex-wrap: wrap; gap: 4px; padding: 0 8px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--hair-strong); color: var(--text-2); }
  .chip.warn { border-color: var(--danger); color: var(--danger); }
  .metric { font-size: 12px; color: var(--text-3); padding: 0 8px; font-variant-numeric: tabular-nums; }
  .tools { gap: 6px; padding: 0 4px 4px; flex-wrap: wrap; }

  /* entrance: a heavy fade-up as each clip enters the viewport (JS adds .reveal only when it can run) */
  .reveal { opacity: 0; transform: translateY(48px); filter: blur(8px);
            transition: opacity .75s var(--spring), transform .75s var(--spring), filter .75s var(--spring); }
  .reveal.in { opacity: 1; transform: none; filter: none; }

  .empty { grid-column: 1 / -1; padding: 80px 16px; text-align: center; color: var(--text-2); }
  .empty strong { display: block; font-size: 24px; letter-spacing: -.02em; color: var(--text); margin-bottom: 8px; font-weight: 600; }

  /* ---------- tables and dialogs ---------- */
  table { border-collapse: separate; border-spacing: 0; width: 100%; background: var(--core); border: 1px solid var(--hair); border-radius: var(--r-core); overflow: hidden; }
  td, th { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--hair); }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--text-3); font-weight: 500; font-size: 13px; }
  dialog { border: 1px solid var(--hair-strong); border-radius: 30px; background: rgba(14, 14, 16, .86); color: var(--text);
           backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
           width: min(580px, calc(100vw - 32px)); padding: 28px; max-height: calc(100dvh - 32px); overflow: auto;
           overscroll-behavior: contain; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
  dialog::backdrop { background: rgba(0, 0, 0, .72); }
  dialog h2 { margin: 0 0 18px; font-size: 24px; letter-spacing: -.03em; font-weight: 600; }
  label { display: block; font-size: 13.5px; color: var(--text-2); margin: 14px 0 6px; }
  input[type=text], textarea, input[type=file] { width: 100%; background: var(--void); border: 1px solid var(--hair);
         border-radius: 14px; padding: 11px 14px; outline: none; }
  input[type=text]:focus, textarea:focus { border-color: rgba(255, 213, 74, .6); }
  input[type=checkbox] { accent-color: var(--subtitle); margin-right: 8px; }
  .actions-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 26px; }
  .hint { color: var(--text-3); font-size: 13.5px; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; filter: none; transition: none; }
    .sub, .cta, .cta .knob, .pill, .tab, .frame video { transition: none; }
    .frame:hover video, .frame.live video, .cta:hover .knob, .card, .card:hover, .stick, .card:hover .stick { transform: none; }
  }
</style>
</head>
<body>
<div class="stage">
<div class="island-wrap">
  <nav class="island" aria-label="memeclip">
    <span class="wordmark" translate="no">memeclip</span>
    <button id="curate" class="cta ghost" type="button" aria-pressed="false">Curate</button>
    <button id="open-upload" class="cta light" type="button"><span class="lbl">Add clip</span><span class="knob"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
  </nav>
</div>

<main>
  <section class="hero">
    <span class="eyebrow">Meme search · Hindi &amp; English</span>
    <h1>Say it with a clip.<span class="tag">no typing needed</span></h1>
    <p class="lede">Search a line you half remember, who's in it, or the mood. Copy the link and the group chat sees the clip.</p>
    <div class="search">
      <div class="shell"><div class="core">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="q" class="sr">Search memes</label>
        <input id="q" type="search" placeholder="Try “salary day” or a line from the clip…" autocomplete="off" spellcheck="false" enterkeyhint="search">
      </div></div>
    </div>
    <div class="tabs" role="group" aria-label="Library views">
      <button class="tab" id="tab-search" type="button" aria-pressed="true">Library</button>
      <button class="tab" id="tab-review" type="button" aria-pressed="false">Needs review</button>
      <button class="tab" id="tab-failed" type="button" aria-pressed="false">Not found</button>
    </div>
    <div class="quick" id="quick" aria-label="Quick searches"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <div id="grid" class="grid"></div>
  <div id="table"></div>
</main>
</div>

<dialog id="upload">
  <form id="upload-form">
    <h2>Add a clip</h2>
    <label for="u-file">Video file</label><input id="u-file" type="file" name="file" accept="video/*" required>
    <label for="u-title">Title, as the source wrote it</label><input id="u-title" type="text" autocomplete="off" name="title">
    <label for="u-caption">Caption</label><input id="u-caption" type="text" autocomplete="off" name="caption">
    <label for="u-lang">Language code (hi, en, ta …). Leave empty to auto-detect</label><input id="u-lang" type="text" autocomplete="off" name="language" spellcheck="false">
    <label for="u-folk">What people call this meme (comma separated)</label><input id="u-folk" type="text" autocomplete="off" name="folk_names">
    <label for="u-people">People in it (comma separated)</label><input id="u-people" type="text" autocomplete="off" name="people">
    <label for="u-film">Film or show</label><input id="u-film" type="text" autocomplete="off" name="source_title">
    <p class="hint">The clip is queued. It shows up in search once the worker has processed it.</p>
    <p class="hint" id="upload-error" role="alert"></p>
    <div class="actions-row">
      <button type="button" class="cta ghost" data-close>Cancel</button>
      <button class="cta light" id="upload-submit">Upload</button>
    </div>
  </form>
</dialog>

<dialog id="edit">
  <form id="edit-form">
    <h2>Edit clip</h2>
    <label for="e-folk">What people call this meme (comma separated)</label><input id="e-folk" type="text" autocomplete="off" name="folk_names">
    <label for="e-said">What is said (Roman script)</label><textarea id="e-said" name="transcript_roman" rows="2"></textarea>
    <label for="e-people">People (comma separated)</label><input id="e-people" type="text" autocomplete="off" name="people">
    <label for="e-film">Film or show</label><input id="e-film" type="text" autocomplete="off" name="source_title">
    <label for="e-desc">What happens on screen</label><textarea id="e-desc" name="description" rows="2"></textarea>
    <label for="e-react">Reactions (comma separated)</label><input id="e-react" type="text" autocomplete="off" name="reactions">
    <label for="e-use">Use when (comma separated)</label><input id="e-use" type="text" autocomplete="off" name="use_when">
    <label for="e-topics">Topics (comma separated)</label><input id="e-topics" type="text" autocomplete="off" name="topics">
    <label><input type="checkbox" name="reviewed">Mark as reviewed</label>
    <p class="hint" id="edit-error" role="alert"></p>
    <div class="actions-row">
      <button type="button" class="cta ghost" data-close>Cancel</button>
      <button class="cta light" id="edit-submit">Save</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // textContent, never innerHTML: clip text is untrusted
  return n;
};

// Fixed icon markup only (no clip data ever goes through innerHTML).
const ICONS = {
  link: '<path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.43"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.33-1.33"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  download: '<path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  volume: '<path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>',
  mute: '<path d="M11 5 6 9H3v6h3l5 4Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>',
};
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "i"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICONS[name];
  return s;
}
function button(cls, label, iconName, { text = true } = {}) {
  // Pill with the icon nested in its own circle ("button in button").
  const b = el("button", "cta " + cls);
  b.type = "button";
  const t = el("span", text ? "lbl" : "sr", label);
  const knob = el("span", "knob"); knob.append(icon(iconName));
  b.append(t, knob);
  if (!text) { b.classList.add("round"); b.setAttribute("aria-label", label); }
  return b;
}
function setLabel(b, text) {
  b.querySelector(".lbl, .sr").textContent = text;
  if (b.hasAttribute("aria-label")) b.setAttribute("aria-label", text);
}

const LISTS = ["folk_names", "people", "reactions", "use_when", "topics"];
const QUICK = ["shocked", "late", "money", "confused", "angry", "happy", "speech"];
// Every mood owns one saturated colour: its sticker on a clip and its quick search.
const MOOD_COLOR = {
  shocked: "#ffe14d", "in a hurry": "#ff8a1f", late: "#ff8a1f", happy: "#ff5fa2", laughing: "#ff5fa2",
  angry: "#ff4d3d", confused: "#b69cff", helpless: "#6ec8ff", sad: "#6ec8ff", scared: "#3ee6c1",
  preachy: "#a8d672", speech: "#a8d672", smug: "#ff9e7a", disgusted: "#c6e04a", dancing: "#7cf06a", money: "#c6f04a",
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
let mode = "search", lastQuery = "", editing = null, timer = null;

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

// A web page cannot put a video file on the clipboard: browsers only accept text,
// HTML and PNG there. So a clip offers the closest real equivalents:
//   Send          the .mp4 file itself, through the system share sheet (Web Share)
//   drag          drop the .mp4 file into Finder, a folder or a chat (Chrome / Edge)
//   Download      save the .mp4 (curate view)
//   Copy link     the short share link (/c/<id>); chat apps unfurl it as the video
// Each one counts as a share, so the query that found the clip is learned.
function fileName(c) {
  const base = (c.folk_names[0] || c.title || `clip-${c.id}`).toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || `clip-${c.id}`;
  return `${base}.mp4`;
}

const fileCache = new Map();   // clip id -> Promise<File>
function clipFile(c) {
  if (!fileCache.has(c.id)) {
    fileCache.set(c.id, fetch(c.url).then((r) => {
      if (!r.ok) throw new Error(r.statusText);
      return r.blob();
    }).then((b) => new File([b], fileName(c), { type: "video/mp4" }))
      .catch((e) => { fileCache.delete(c.id); throw e; }));
  }
  return fileCache.get(c.id);
}

const canSendFiles = !!(navigator.canShare &&
  navigator.canShare({ files: [new File([new Blob()], "x.mp4", { type: "video/mp4" })] }));

function recordShare(c) {
  return api(`/clips/${c.id}/share`, { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ q: mode === "search" ? lastQuery : null }) })
    .catch(() => {});
}

function flash(b, text, back) {
  setLabel(b, text);
  b.classList.add("done");
  setTimeout(() => { setLabel(b, back); b.classList.remove("done"); }, 1600);
}

// Hover to play: a clip plays (muted) while the pointer is over it and stops when
// it leaves. Only one clip plays at a time. Click toggles sound. Touch screens have
// no hover, so a tap plays or stops instead. Keyboard focus plays too. With reduced
// motion nothing plays on its own: click or Enter plays.
let playing = null;

function playOnly(frame) {
  if (playing && playing !== frame) stopClip(playing);
  playing = frame;
  frame.classList.add("live");
  frame._video.play().catch(() => {});   // muted autoplay is always allowed
}

function stopClip(frame) {
  const v = frame._video;
  v.pause();
  v.currentTime = 0;
  v.muted = true;
  frame._sound(false);
  frame.classList.remove("live");
  frame._time.style.transform = "scaleX(0)";
  if (playing === frame) playing = null;
}

function card(c, i) {
  const node = el("article", "card" + (i === 0 ? " feature" : ""));
  const shell = el("div", "shell"), core = el("div", "core");
  shell.append(core); node.append(shell);

  const frame = el("div", "frame");
  frame.tabIndex = 0;
  frame.setAttribute("role", "button");
  frame.setAttribute("aria-label", `Play ${c.folk_names[0] || c.title || "clip"}`);
  const video = el("video");
  video.src = c.url; video.poster = c.thumb || ""; video.preload = "none"; video.loop = true; video.playsInline = true;
  video.muted = true;
  const sub = el("div", "sub", c.transcript_roman ? c.transcript_roman.slice(0, 120) : "");
  const snd = el("div", "snd"); snd.append(icon("mute"));
  const time = el("div", "bar-time");
  frame.append(video, sub, snd, time);
  const mood = (c.reactions || [])[0];
  if (mood) {
    node.style.setProperty("--mood", MOOD_COLOR[mood] || "#f4ede4");
    frame.append(el("div", "stick", mood));
  }
  const topic = (c.topics || [])[0];
  if (topic) frame.append(el("div", "badge", "#" + topic));
  frame._video = video; frame._time = time;
  frame._sound = (on) => { snd.replaceChildren(icon(on ? "volume" : "mute")); };

  video.ontimeupdate = () => { if (video.duration) time.style.transform = `scaleX(${video.currentTime / video.duration})`; };
  frame.onpointerenter = (e) => { if (e.pointerType === "mouse" && !reduceMotion.matches) playOnly(frame); };
  frame.onpointerleave = (e) => { if (e.pointerType === "mouse") stopClip(frame); };
  frame.onfocus = () => { if (frame.matches(":focus-visible") && !reduceMotion.matches) playOnly(frame); };
  frame.onblur = () => stopClip(frame);
  const toggle = (touch) => {
    if (touch || reduceMotion.matches) {                       // tap, or reduced motion: play or stop
      if (frame.classList.contains("live")) stopClip(frame); else playOnly(frame);
    } else {                                                  // mouse: already playing, toggle sound
      video.muted = !video.muted;
      frame._sound(!video.muted);
      if (video.paused) playOnly(frame);
    }
  };
  frame.onclick = (e) => toggle(!!e.pointerType && e.pointerType !== "mouse");
  frame.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(true); } };

  // Dragging the video out drops the .mp4 file (Chrome / Edge read DownloadURL).
  video.draggable = true;
  video.ondragstart = (e) => {
    const abs = new URL(c.url, location.href).href;
    e.dataTransfer.setData("DownloadURL", `video/mp4:${fileName(c)}:${abs}`);
    e.dataTransfer.setData("text/uri-list", c.share_url || abs);
    e.dataTransfer.setData("text/plain", c.share_url || abs);
    e.dataTransfer.effectAllowed = "copy";
    recordShare(c);
  };
  core.append(frame);

  const row = el("div", "row");
  const titles = el("div", "titles");
  titles.append(el("div", "name", c.folk_names[0] || c.title || "(untitled)"));
  const by = [...c.people, c.source_title].filter(Boolean).join(" · ");
  if (by) titles.append(el("div", "by", by));
  row.append(titles);

  const acts = el("div", "acts");
  const copy = button("", "Copy link", "link");
  copy.setAttribute("aria-label", "Copy link");   // the label is hidden on small posters
  copy.title = "Copy link";
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(c.share_url || new URL(c.url, location.href).href);
      recordShare(c);
      flash(copy, "Copied", "Copy link");
    } catch { flash(copy, "Copy failed", "Copy link"); }
  };
  acts.append(copy);

  if (canSendFiles) {
    const send = button("iconly", "Send video", "send", { text: false });
    // Fetch the file before the click lands: some browsers (Safari) only allow the
    // share sheet while the click is still "fresh", so there is no time to download then.
    const warm = () => clipFile(c).catch(() => {});
    send.onpointerenter = warm; send.onfocus = warm; send.ontouchstart = warm;
    send.onclick = async () => {
      try {
        const file = await clipFile(c);
        await navigator.share({ files: [file], title: c.folk_names[0] || c.title || "meme" });
        recordShare(c);
        flash(send, "Sent", "Send video");
      } catch (e) {
        if (e.name === "AbortError") return;                 // closed the share sheet
        flash(send, e.name === "NotAllowedError" ? "Tap again to send" : "Could not send", "Send video");
      }
    };
    acts.append(send);
  }
  row.append(acts);
  core.append(row);

  // ---- curation only ----
  const chips = el("div", "curate-only chips");
  for (const r of c.reactions || []) chips.append(el("span", "chip", r));
  for (const t of c.topics || []) chips.append(el("span", "chip", "#" + t));
  for (const r of c.review_reasons) chips.append(el("span", "chip warn", r.replaceAll("_", " ")));
  if (chips.children.length) core.append(chips);

  const signals = `shared ${c.shares} · seen ${c.duplicates_seen}×`;
  core.append(Object.assign(el("div", "curate-only metric", c.score == null ? signals
    : `score ${c.score} · keyword ${c.kw} · meaning ${c.sem} · topic ${c.tm} · ${signals}`), {}));

  const tools = el("div", "curate-only tools");
  const download = button("", "Download", "download");
  download.onclick = async () => { recordShare(c); const a = el("a"); a.href = c.url; a.download = fileName(c); a.click(); };
  const edit = button("", "Edit", "edit");
  edit.onclick = () => openEdit(c.id);
  tools.append(download, edit);
  core.append(tools);
  return node;
}

// Clips fade up as they enter the viewport. Only added when IntersectionObserver
// exists and motion is welcome, so without it everything is simply visible.
const revealer = ("IntersectionObserver" in window) ? new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) { e.target.classList.add("in"); revealer.unobserve(e.target); }
}, { rootMargin: "0px 0px -8% 0px" }) : null;
function reveal(nodes) {
  if (!revealer || reduceMotion.matches) return;
  // The fade-up runs on the inner shell, so the poster's tilt (on the card) is kept.
  nodes.forEach((n, i) => {
    const target = n.querySelector(".shell") || n;
    target.classList.add("reveal"); target.style.transitionDelay = `${(i % 4) * 70}ms`; revealer.observe(target);
  });
}

function showCards(results, status, emptyTitle, emptyHelp) {
  playing = null;
  $("table").replaceChildren();
  if (!results.length) {
    const e = el("div", "empty");
    e.append(el("strong", "", emptyTitle), el("span", "", emptyHelp));
    $("grid").replaceChildren(e);
  } else {
    const cards = results.map((c, i) => card(c, i));
    $("grid").replaceChildren(...cards);
    reveal(cards);
  }
  $("status").replaceChildren(...status);
}

function intentText(intent) {
  const parts = Object.entries(intent || {}).map(([k, p]) => (document.body.classList.contains("curate") ? `${k} ${p}` : k));
  return parts.length ? parts.join(", ") : "";
}

async function runSearch() {
  lastQuery = $("q").value.trim();
  for (const b of $("quick").children) b.setAttribute("aria-pressed", String(b.textContent === lastQuery));
  try {
    const data = await api(`/search?q=${encodeURIComponent(lastQuery)}`);
    const status = [];
    if (!lastQuery) {
      status.push(el("span", "", data.count ? "Trending now" : ""));
    } else {
      status.push(el("span", "", `${data.count} clip${data.count === 1 ? "" : "s"} · `));
      const read = intentText(data.intent);
      status.push(read ? Object.assign(el("span", "read", `reading it as ${read}`)) : el("span", "dim", "matched on the words"));
    }
    showCards(data.results, status,
      lastQuery ? `Nothing for “${lastQuery}” yet` : "No clips yet",
      lastQuery ? "Try other words, a line from the clip, or a mood like shocked or late."
                : "Add a clip, or drop video files into data/inbox.");
  } catch (e) { $("status").textContent = `Search failed: ${e.message}. Check that memeclip is running, then search again.`; }
}

async function runReview() {
  const data = await api("/review");
  showCards(data.results, [el("span", "", `${data.count} clip${data.count === 1 ? "" : "s"} the pipeline was unsure about`)],
            "Nothing to review", "Every clip passed its checks.");
}

async function runFailed() {
  const data = await api("/queries/failed");
  $("grid").replaceChildren();
  $("status").textContent = "Searches that found nothing. Each one is a missing clip or a missing way to find one.";
  const table = el("table");
  const head = el("tr"); head.append(el("th", "", "Search"), el("th", "", "Times"));
  table.append(head);
  for (const q of data.queries) {
    const tr = el("tr"); tr.append(el("td", "", q.query), el("td", "", q.times)); table.append(tr);
  }
  $("table").replaceChildren(table);
}

function setMode(next) {
  mode = next;
  for (const m of ["search", "review", "failed"]) $("tab-" + m).setAttribute("aria-pressed", String(m === mode));
  ({ search: runSearch, review: runReview, failed: runFailed })[mode]();
}

function setCurate(on) {
  document.body.classList.toggle("curate", on);
  $("curate").setAttribute("aria-pressed", String(on));
  if (!on && mode !== "search") mode = "search";
  history.replaceState(null, "", on ? "#curate" : location.pathname + location.search);
  setMode(mode);
}

async function openEdit(id) {
  const c = await api(`/clips/${id}`);
  editing = id;
  const f = $("edit-form");
  for (const k of LISTS) f[k].value = c[k].join(", ");
  for (const k of ["transcript_roman", "source_title", "description"]) f[k].value = c[k];
  f.reviewed.checked = false;
  $("edit").showModal();
}

$("edit-form").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target, body = {};
  for (const k of LISTS) body[k] = f[k].value.split(",").map((s) => s.trim()).filter(Boolean);
  for (const k of ["transcript_roman", "source_title", "description"]) body[k] = f[k].value;
  if (f.reviewed.checked) body.reviewed = true;
  const submit = $("edit-submit");
  submit.disabled = true; submit.textContent = "Saving…"; $("edit-error").textContent = "";
  try {
    await api(`/clips/${editing}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    $("edit").close();
    setMode(mode);
  } catch (err) {
    $("edit-error").textContent = `Not saved: ${err.message}. Your changes are still here; try Save again.`;
  } finally { submit.disabled = false; submit.textContent = "Save"; }
};

$("upload-form").onsubmit = async (e) => {
  e.preventDefault();
  const submit = $("upload-submit");
  submit.disabled = true; submit.textContent = "Uploading…"; $("upload-error").textContent = "";
  try {
    const out = await api("/upload", { method: "POST", body: new FormData(e.target) });
    $("status").textContent = `Queued ${out.queued_as}. It shows up in search in a few seconds.`;
    e.target.reset();
    $("upload").close();
  } catch (err) {
    $("upload-error").textContent = `Upload failed: ${err.message}. Check the file is a video under 30 seconds, then try again.`;
  } finally { submit.disabled = false; submit.textContent = "Upload"; }
};

for (const word of QUICK) {
  const b = el("button", "pill", word);
  b.style.setProperty("--mood", MOOD_COLOR[word] || "#f4ede4");
  b.type = "button";
  b.setAttribute("aria-pressed", "false");
  b.onclick = () => { $("q").value = lastQuery === word ? "" : word; setMode("search"); };
  $("quick").append(b);
}

$("open-upload").onclick = () => $("upload").showModal();
$("curate").onclick = () => setCurate(!document.body.classList.contains("curate"));
for (const b of document.querySelectorAll("[data-close]")) b.onclick = () => b.closest("dialog").close();
for (const m of ["search", "review", "failed"]) $("tab-" + m).onclick = () => setMode(m);
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(() => setMode("search"), 350); };
// #curate in the address opens the curation view (also when only the # part changes)
const curateFromHash = () => {
  const on = location.hash === "#curate";
  if (on !== document.body.classList.contains("curate")) setCurate(on);
};
addEventListener("hashchange", curateFromHash);
if (location.hash === "#curate") { document.body.classList.add("curate"); $("curate").setAttribute("aria-pressed", "true"); }
if (matchMedia("(pointer: fine)").matches) $("q").focus();
setMode("search");
</script>
</body>
</html>
