<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>memeclip settings</title>
<link rel="stylesheet" href="picker.css">
<style>
  body { padding: 28px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
          border-radius: 8px; padding: 9px 11px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--accent); color: #fff; cursor: pointer; }
  #msg { margin-top: 12px; min-height: 1.4em; }
  ul { color: var(--muted); padding-left: 18px; }
</style>
</head>
<body>
  <h1>memeclip</h1>
  <p>Where your memeclip server runs. Links you paste use the server's public address.</p>
  <form id="f">
    <label for="server">Server address</label>
    <div class="row">
      <input id="server" type="url" placeholder="http://localhost:8000" required>
      <button type="submit">Save</button>
    </div>
  </form>
  <div id="msg" role="status"></div>
  <ul>
    <li><b>Alt+Shift+M</b> while typing in a chat: open the picker over the box.</li>
    <li><b>Alt+Shift+K</b> or the toolbar button: search, copy and paste.</li>
    <li>Change the keys at <code>chrome://extensions/shortcuts</code>.</li>
  </ul>
  <script src="options.js"></script>
</body>
</html>
