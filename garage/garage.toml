# Garage: an S3-compatible bucket on this machine for the web-ready clips (STORAGE=s3).
# Single node, one copy: the originals in data/processed are the backup.
# Secrets are NOT here: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN come from .env
# (scripts/setup_garage.sh generates them).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"            # survives a hard kill better than lmdb; plenty fast for this

replication_factor = 1          # one node

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"
root_domain = ".s3.garage.localhost"

[s3_web]                        # unused, but some versions refuse to start without it
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
